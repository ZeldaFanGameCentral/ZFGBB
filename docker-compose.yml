name: zfgbb

services:
  postgresql:
    build:
      context: .
      dockerfile: Dockerfile
      target: database

    env_file:
      - .env.local
      - .env.docker

    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${POSTGRES_DB:-zfgc_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-bootstrap-password}
      POSTGRES_USER: ${POSTGRES_USER:-zfgbb_bootstrap}
      SPRING_DATASOURCE_URL: null
      SPRING_PROFILES_ACTIVE: null
      ZFGBB_AUTH_JWT_SECRET: null
      ZFGBB_CONTENT_PATH: null
      ZFGBB_INSTALL_TOKEN: null
      ZFGBB_MIGRATOR_ENABLED: null

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - data:/var/lib/postgresql/data
      - ./scripts/postgresql-init-application-role.sh:/docker-entrypoint-initdb.d/01-application-role.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 2s

    restart: unless-stopped

    networks:
      - zfgbb

    extra_hosts:
      - "host.docker.internal:host-gateway"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: deploy

    env_file:
      - .env.local
      - .env.docker

    ports:
      - "127.0.0.1:${ZFGBB_BACKEND_PORT:-8080}:8080"

    volumes:
      - content:/usr/local/tomcat/webapps/content
      - operations:/var/lib/zfgbb/operations

    depends_on:
      postgresql:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - zfgbb

    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  data:
  content:
  operations:

networks:
  zfgbb:
    driver: bridge
