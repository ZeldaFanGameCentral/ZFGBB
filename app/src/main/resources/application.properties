spring.application.name=zfgbb
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jackson.default-property-inclusion=non_null

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.mail.enabled=${ZFGBB_MAIL_HEALTH_ENABLED:false}
management.health.db.enabled=false

spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
spring.datasource.hikari.data-source-properties.ApplicationName=zfgbb-api

zfgbb.mybatis.statement-timeout-seconds=${ZFGBB_MYBATIS_STATEMENT_TIMEOUT_SECONDS:180}
mybatis.configuration.default-statement-timeout=${zfgbb.mybatis.statement-timeout-seconds}

spring.flyway.enabled=true
spring.flyway.schemas=zfgbb
spring.flyway.default-schema=zfgbb
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/setup,classpath:db/migration
spring.flyway.out-of-order=true

server.servlet.context-path=/zfgbb
server.forward-headers-strategy=${ZFGBB_FORWARD_HEADERS_STRATEGY:framework}

spring.servlet.multipart.max-file-size=${ZFGBB_UPLOAD_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${ZFGBB_UPLOAD_MAX_REQUEST_SIZE:30MB}

zfgbb.auth.jwt.secret=${ZFGBB_AUTH_JWT_SECRET:dev-only-secret-replace-me-with-32-or-more-bytes-please}
zfgbb.auth.jwt.access-ttl-minutes=${ZFGBB_AUTH_JWT_ACCESS_TTL_MINUTES:15}
zfgbb.auth.refresh.ttl-days=${ZFGBB_AUTH_REFRESH_TTL_DAYS:30}
zfgbb.auth.refresh.session-ttl-hours=${ZFGBB_AUTH_REFRESH_SESSION_TTL_HOURS:8}
zfgbb.auth.refresh.rotation-grace-seconds=${ZFGBB_AUTH_REFRESH_ROTATION_GRACE_SECONDS:60}

zfgbb.auth.lockout.failed-attempts=${ZFGBB_AUTH_LOCKOUT_FAILED_ATTEMPTS:10}
zfgbb.auth.lockout.duration-minutes=${ZFGBB_AUTH_LOCKOUT_DURATION_MINUTES:15}

# 0 for max-age-days = never expire
zfgbb.auth.password.max-age-days=${ZFGBB_AUTH_PASSWORD_MAX_AGE_DAYS:0}
zfgbb.install.token=${ZFGBB_INSTALL_TOKEN:}
zfgbb.install.sample-archive=${ZFGBB_INSTALL_SAMPLE_ARCHIVE:classpath:sample-data/backup.tar.gz}

zfgbb.operations.pg-dump=${ZFGBB_OPERATIONS_PG_DUMP:pg_dump}
zfgbb.operations.pg-restore=${ZFGBB_OPERATIONS_PG_RESTORE:pg_restore}
zfgbb.operations.work-path=${ZFGBB_OPERATIONS_WORK_PATH:${java.io.tmpdir}/zfgbb-operations}
zfgbb.operations.command-timeout=${ZFGBB_OPERATIONS_COMMAND_TIMEOUT:30m}
zfgbb.operations.mutation-drain-timeout=${ZFGBB_OPERATIONS_MUTATION_DRAIN_TIMEOUT:30s}
zfgbb.operations.backup-ttl=${ZFGBB_OPERATIONS_BACKUP_TTL:24h}
zfgbb.operations.creation-timeout=${ZFGBB_OPERATIONS_CREATION_TIMEOUT:4h}
zfgbb.operations.download-claim-timeout=${ZFGBB_OPERATIONS_DOWNLOAD_CLAIM_TIMEOUT:6h}
zfgbb.operations.orphan-grace=${ZFGBB_OPERATIONS_ORPHAN_GRACE:1h}
zfgbb.operations.metadata-retention=${ZFGBB_OPERATIONS_METADATA_RETENTION:7d}
zfgbb.operations.cleanup-interval=${ZFGBB_OPERATIONS_CLEANUP_INTERVAL:1h}
zfgbb.operations.storage-margin-bytes=${ZFGBB_OPERATIONS_STORAGE_MARGIN_BYTES:536870912}
zfgbb.operations.compressed-bytes=${ZFGBB_OPERATIONS_COMPRESSED_BYTES:2147483648}
zfgbb.operations.expanded-bytes=${ZFGBB_OPERATIONS_EXPANDED_BYTES:8589934592}
zfgbb.operations.manifest-bytes=${ZFGBB_OPERATIONS_MANIFEST_BYTES:1048576}
zfgbb.operations.dump-bytes=${ZFGBB_OPERATIONS_DUMP_BYTES:4294967296}
zfgbb.operations.content-bytes=${ZFGBB_OPERATIONS_CONTENT_BYTES:4294967296}
zfgbb.operations.entries=${ZFGBB_OPERATIONS_ENTRIES:100000}
zfgbb.operations.path-bytes=${ZFGBB_OPERATIONS_PATH_BYTES:1024}

zfgbb.auth.cookie.secure=${ZFGBB_AUTH_COOKIE_SECURE:true}

zfgbb.migrator.enabled=${ZFGBB_MIGRATOR_ENABLED:false}
zfgbb.migrator.app-base-url=${ZFGBB_MIGRATOR_APP_BASE_URL:}
zfgbb.registration.enabled=${ZFGBB_REGISTRATION_ENABLED:false}

zfgbb.cors.allowed-origin-patterns=${ZFGBB_CORS_ALLOWED_ORIGIN_PATTERNS:https://zeldafangamecentral.github.io,https://*.zfgc.com,https://zfgc.com,https://zfgc.com:28080}

zfgbb.account-deletion.confirm-base-url=${ZFGBB_ACCOUNT_DELETION_CONFIRM_BASE_URL:https://zfgc.com/account/delete/confirm}
zfgbb.account-deletion.confirm-ttl-hours=${ZFGBB_ACCOUNT_DELETION_CONFIRM_TTL_HOURS:24}

spring.mail.host=${ZFGBB_MAIL_HOST:}
spring.mail.port=${ZFGBB_MAIL_PORT:465}
spring.mail.username=${ZFGBB_MAIL_USERNAME:}
spring.mail.password=${ZFGBB_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${ZFGBB_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${ZFGBB_MAIL_SMTP_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.enable=${ZFGBB_MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${ZFGBB_MAIL_SMTP_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${ZFGBB_MAIL_SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${ZFGBB_MAIL_SMTP_WRITE_TIMEOUT_MS:10000}
zfgbb.mail.from=${ZFGBB_MAIL_FROM:noreply@zfgc.com}

mbg.target-package.mapper=com.zfgc.zfgbb.mappers
mbg.target-package.domain=com.zfgc.zfgbb.dbo
mbg.target-project.java=src/main/java
mbg.target-project.resources=src/main/resources
