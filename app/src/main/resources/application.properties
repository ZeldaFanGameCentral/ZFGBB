spring.application.name=zfgbb
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jackson.default-property-inclusion=non_null


management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.mail.enabled=${ZFGBB_MAIL_HEALTH_ENABLED:false}
spring.flyway.enabled=true
spring.flyway.schemas=zfgbb
spring.flyway.default-schema=zfgbb
spring.flyway.create-schemas=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/setup,classpath:db/migration
spring.flyway.out-of-order=false

server.servlet.context-path=/zfgbb

spring.servlet.multipart.max-file-size=${ZFGBB_UPLOAD_MAX_FILE_SIZE:2GB}
spring.servlet.multipart.max-request-size=${ZFGBB_UPLOAD_MAX_REQUEST_SIZE:2GB}

zfgbb.auth.jwt.secret=${ZFGBB_AUTH_JWT_SECRET:dev-only-secret-replace-me-with-32-or-more-bytes-please}
zfgbb.auth.jwt.access-ttl-minutes=${ZFGBB_AUTH_JWT_ACCESS_TTL_MINUTES:15}
zfgbb.auth.refresh.ttl-days=${ZFGBB_AUTH_REFRESH_TTL_DAYS:30}
zfgbb.auth.refresh.session-ttl-hours=${ZFGBB_AUTH_REFRESH_SESSION_TTL_HOURS:8}
zfgbb.auth.refresh.rotation-grace-seconds=${ZFGBB_AUTH_REFRESH_ROTATION_GRACE_SECONDS:60}

zfgbb.auth.lockout.failed-attempts=${ZFGBB_AUTH_LOCKOUT_FAILED_ATTEMPTS:10}
zfgbb.auth.lockout.duration-minutes=${ZFGBB_AUTH_LOCKOUT_DURATION_MINUTES:15}

# 0 for max-age-days = never expire
zfgbb.auth.password.max-age-days=${ZFGBB_AUTH_PASSWORD_MAX_AGE_DAYS:0}
zfgbb.install.token=${ZFGBB_INSTALL_TOKEN:}

zfgbb.auth.cookie.secure=${ZFGBB_AUTH_COOKIE_SECURE:true}

zfgbb.migrator.enabled=${ZFGBB_MIGRATOR_ENABLED:false}
zfgbb.registration.enabled=${ZFGBB_REGISTRATION_ENABLED:false}

zfgbb.cors.allowed-origin-patterns=${ZFGBB_CORS_ALLOWED_ORIGIN_PATTERNS:https://zeldafangamecentral.github.io,https://*.zfgc.com,https://zfgc.com,https://zfgc.com:28080}

spring.mail.host=${ZFGBB_MAIL_HOST:}
spring.mail.port=${ZFGBB_MAIL_PORT:465}
spring.mail.username=${ZFGBB_MAIL_USERNAME:}
spring.mail.password=${ZFGBB_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${ZFGBB_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${ZFGBB_MAIL_SMTP_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.enable=${ZFGBB_MAIL_SMTP_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${ZFGBB_MAIL_SMTP_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${ZFGBB_MAIL_SMTP_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${ZFGBB_MAIL_SMTP_WRITE_TIMEOUT_MS:10000}
zfgbb.mail.from=${ZFGBB_MAIL_FROM:noreply@zfgc.com}

mbg.target-package.mapper=com.zfgc.zfgbb.mappers
mbg.target-package.domain=com.zfgc.zfgbb.dbo
mbg.target-project.java=src/main/java
mbg.target-project.resources=src/main/resources
