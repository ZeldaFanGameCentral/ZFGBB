name: zfgbb

x-smf-mysql-base: &smf-mysql-base
  image: mysql:5.7
  command:
    - --character-set-server=utf8
    - --collation-server=utf8_general_ci
    - --sql-mode=NO_ENGINE_SUBSTITUTION
  environment:
    MYSQL_ROOT_PASSWORD: ${SMF_ROOT_PASSWORD:-rootpw}
    MYSQL_DATABASE: ${SMF_DATABASE:-smf}
    MYSQL_USER: ${SMF_USER:-smf}
    MYSQL_PASSWORD: ${SMF_PASSWORD:-smfpw}
  networks:
    - zfgbb
  healthcheck:
    test:
      [
        "CMD",
        "mysqladmin",
        "ping",
        "-h",
        "localhost",
        "-u",
        "root",
        "-p${SMF_ROOT_PASSWORD:-rootpw}",
      ]
    interval: 2s
    timeout: 3s
    retries: 30
    start_period: 5s
  restart: unless-stopped

services:
  smf_mysql:
    profiles: [ live ]
    <<: *smf-mysql-base
    ports:
      - "${SMF_MYSQL_PORT:-3308}:3306"
    volumes:
      - smf_live_data:/var/lib/mysql

  smf_mysql_fixture:
    profiles: [ fixture ]
    <<: *smf-mysql-base
    ports:
      - "${SMF_FIXTURE_MYSQL_PORT:-3307}:3306"
    volumes:
      - smf_fixture_data:/var/lib/mysql
      - ${LEGACY_DATABASE:-./app/src/test/resources/legacy-database.sql}:/docker-entrypoint-initdb.d/legacy-database.sql:ro

volumes:
  smf_live_data:
  smf_fixture_data:

networks:
  zfgbb:
    driver: bridge
